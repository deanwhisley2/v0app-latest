version: "3.8"

services:
  compreface-postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: compreface
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
    volumes:
      - compreface-postgres-data:/var/lib/postgresql/data

  compreface-core:
    image: exadel/compreface-core:1.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/compreface
      ENABLE_EMAIL_SERVER: "false"
      ADMIN_JAVA_OPTS: -Xmx512m
    depends_on:
      - compreface-postgres

  compreface-api:
    image: exadel/compreface-api:1.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/compreface
      SPRING_PROFILES_ACTIVE: dev
      SAVE_IMAGES_TO_DB: "true"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
      CONNECTION_TIMEOUT: 10000
      READ_TIMEOUT: 60000
    depends_on:
      - compreface-postgres
      - compreface-core
    # API is internal; use compreface-fe (nginx) as the host entry point — not :8000 on this container.

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/compreface
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - compreface-postgres
      - compreface-core
    ports:
      - "8001:8080"

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    restart: unless-stopped
    environment:
      CLIENT_MAX_BODY_SIZE: 20M
      PROXY_READ_TIMEOUT: 300s
      PROXY_CONNECT_TIMEOUT: 300s
      PROXY_SEND_TIMEOUT: 300s
    depends_on:
      - compreface-api
      - compreface-admin
    ports:
      # Official layout: nginx proxies /api/v1/* to compreface-api (use this URL from the Next.js host).
      - "8000:80"

volumes:
  compreface-postgres-data:
