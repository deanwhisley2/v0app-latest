# Large headers: oversized cookies or many Set-Cookie lines from Supabase SSR can exceed defaults.
# Apply inside http {} or server {} as appropriate for your distro.
#
# large_client_header_buffers 8 32k;
# proxy_buffer_size 16k;
# proxy_buffers 8 32k;
# proxy_busy_buffers_size 32m;

server {
    listen 80;
    server_name nexus.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
